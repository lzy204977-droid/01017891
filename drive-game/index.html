<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#081120">
<title>驾控挑战 · 双车命运</title>
<style>
:root{color-scheme:dark;--sky:#7cdaff;--gold:#ffd888;--blue:#37c8ff;--red:#ff4e5c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#03070e;color:white;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;touch-action:none}
button{font:inherit;cursor:pointer;color:inherit;-webkit-appearance:none;appearance:none;border:0;outline:0}
#app{position:relative;width:100%;height:100%;height:100dvh;overflow:hidden;isolation:isolate}
.screen{position:absolute;inset:0;display:none;overflow:hidden}.screen.active{display:block}
/* Menu */
#menu{background:linear-gradient(160deg,#152b49 0%,#111e32 40%,#090d19 100%)}
#menu:before{content:"";position:absolute;inset:-35px;background:linear-gradient(0deg,rgba(1,3,11,.94),rgba(4,10,22,.55) 57%,rgba(5,13,29,.74)),url('assets/menu.webp') center center/cover no-repeat;filter:blur(15px) saturate(1.15);transform:scale(1.08)}
.ambient{position:absolute;pointer-events:none;border-radius:50%;filter:blur(60px);opacity:.45}.ambient.a{width:60vw;height:40vh;background:#096ba3;top:22%;left:-23%}.ambient.b{width:60vw;height:40vh;background:#b57930;top:30%;right:-27%}
.menu-layout{position:relative;height:100%;display:flex;flex-direction:column;justify-content:space-between;gap:12px;padding:calc(env(safe-area-inset-top) + 20px) clamp(16px,4.2vw,38px) calc(env(safe-area-inset-bottom) + 24px)}
.brand-kicker{font-size:11px;letter-spacing:.32em;font-weight:700;color:#83dafa;text-align:center}.brand-title{margin:3px 0 0;text-align:center;font-size:clamp(40px,10vw,65px);font-weight:1000;font-style:italic;line-height:1.1;letter-spacing:.03em;text-shadow:0 5px 28px #208ac488,0 2px 1px #121a2a}.brand-title span{color:#ffdc97;text-shadow:0 0 25px #ffc15c66}.menu-subtitle{text-align:center;margin:10px 0 0;color:#c9dcf0;font-size:13px;letter-spacing:.1em}
.garage{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:11px;align-items:stretch;flex:1;min-height:0;padding:6px 0 0}
.car-option{position:relative;min-width:0;overflow:hidden;text-align:left;border:1.5px solid #96b1dc47;background:linear-gradient(180deg,#1b344ac7 0%,#0a1426e8 45%,#101b30f5 100%);border-radius:20px;padding:9px;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-end;box-shadow:0 10px 20px #0006, inset 0 1px #ffffff12;transition:border-color .15s,box-shadow .15s,transform .15s;touch-action:manipulation}
.car-option.vselected{border-color:#50caff;box-shadow:0 0 0 1px #57ccff9c,0 0 30px #238fff50,inset 0 1px #ffffff35;transform:translateY(-3px)}
.car-option.mselected{border-color:#ffd17d;box-shadow:0 0 0 1px #ffd98f9c,0 0 30px #ffae4550,inset 0 1px #ffffff35;transform:translateY(-3px)}
.car-img-wrap{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.car-img-wrap:after{content:"";position:absolute;left:3%;right:3%;bottom:13%;height:14%;border-radius:50%;background:#000b;filter:blur(12px)}
.car-img{display:block;position:relative;z-index:1;width:118%;height:auto;object-fit:contain;max-height:95%;filter:drop-shadow(0 15px 12px #000a)}
.car-img.m{width:125%;max-width:unset}
.car-info{position:relative;z-index:2;flex:none;border-top:1px solid #ffffff24;padding:12px 0 8px;text-align:center}
.car-name{font-size:clamp(16px,4.8vw,22px);font-weight:900;white-space:nowrap;letter-spacing:-.04em}.car-tag{font-size:11px;color:#b2c6db;margin-top:5px}.pick-row{display:flex;align-items:center;justify-content:center;margin-top:10px;font-size:11px;color:#cfdef2;gap:7px}
.pick-dot{width:20px;height:20px;border:2px solid #a7bdd2a0;border-radius:50%;display:grid;place-items:center}.vselected .pick-dot{border-color:#4ad7ff;background:#12acee;color:white}.mselected .pick-dot{border-color:#ffe1a5;background:#c88926;color:white}.pick-dot:after{content:""}.vselected .pick-dot:after,.mselected .pick-dot:after{content:"✓";font-weight:900;font-size:13px}
.menu-bottom{flex:none}.route-note{text-align:center;font-size:11px;color:#a5b5cb;margin:1px auto 12px}.route-note b{color:#e9f1ff}
.main-btn{background:linear-gradient(100deg,#ffcb69,#fff0bd 50%,#f6b948);color:#352113;font-weight:1000;border-radius:16px;display:block;width:100%;padding:16px 10px;box-shadow:0 8px 28px #e799405c,inset 0 2px #fff8d6;font-size:clamp(19px,5.5vw,25px);letter-spacing:.14em;touch-action:manipulation}
.disclaimer{text-align:center;font-size:10px;color:#9bacc6;margin-top:11px;line-height:1.6}
/* Drive */
#drive{background:#0c1622}#roadCanvas{position:absolute;inset:0;width:100%;height:100%}
.vignette{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(2,8,23,.39),transparent 24%,transparent 55%,rgba(0,4,14,.5))}
.drive-head{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:12px;right:12px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;z-index:4}
.glass{border:1px solid #c0d7ff38;background:linear-gradient(135deg,#07172edb,#0b1928b9);backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px);box-shadow:0 5px 18px #01061266;border-radius:15px}
.dashboard-meta{padding:10px 12px;min-width:116px}.drive-model{font-weight:900;font-size:13px}.drive-model em{font-style:normal;color:#a5dcff}.meta-km{font-size:11px;color:#aac1d6;margin-top:6px}.pause-btn{padding:12px 14px;font-size:19px;line-height:1;touch-action:manipulation}
.map{position:absolute;right:13px;top:calc(env(safe-area-inset-top) + 98px);width:91px;height:91px;border:2px solid #93a7c65c;border-radius:50%;z-index:3;overflow:hidden;background:radial-gradient(circle at 60% 36%,#344e60f2,#08172ccc);box-shadow:0 4px 15px #041026af;opacity:.9}
.map:before{content:"";position:absolute;top:-18%;left:40%;width:14px;height:142%;background:#617082;transform:rotate(23deg);box-shadow:-26px 0 0 #283548,22px 0 0 #283548}.map:after{content:"➤";position:absolute;top:34%;left:42%;color:#42c8ff;font-size:27px;transform:rotate(-70deg);filter:drop-shadow(0 0 5px #24aaff)}
.vehicle{position:absolute;z-index:2;width:min(73vw,435px);max-height:56vh;object-fit:contain;left:50%;top:58%;transform:translate(-50%,-50%);transform-origin:54% 72%;filter:drop-shadow(5px 27px 13px #01060ec7) drop-shadow(0 0 4px #74a6d144);pointer-events:none;will-change:transform}
.car-shadow{position:absolute;top:78%;left:50%;width:min(62vw,320px);height:30px;border-radius:50%;transform:translateX(-50%);background:#000b;filter:blur(14px);z-index:1;pointer-events:none}
.speed-cluster{position:absolute;z-index:5;right:12px;top:calc(env(safe-area-inset-top) + 216px);width:clamp(112px,32vw,154px);height:clamp(112px,32vw,154px);border-radius:50%;border:2px solid #73c2efb2;background:radial-gradient(circle,#091224ee 48%,#162f48e8 72%,#040d20ec 74%);box-shadow:0 0 23px #0d93e44a, inset 0 0 20px #328ee656;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden}
.speed-cluster:before{content:"";position:absolute;inset:7px;border:5px solid transparent;border-top-color:#48d0ff;border-right-color:#438ccf;border-radius:50%;transform:rotate(-28deg);opacity:.75}
.speed-cluster.alert{border-color:#ff6971;box-shadow:0 0 28px #fd385f87,inset 0 0 20px #ff3e5944}
.speed-number{font-size:clamp(39px,11vw,56px);line-height:1;font-weight:900;font-variant-numeric:tabular-nums;font-feature-settings:"tnum";letter-spacing:-.06em;z-index:1}.speed-unit{font-size:13px;color:#c7d9eb;z-index:1;margin-top:1px}.needle{position:absolute;bottom:50%;left:50%;height:36%;width:3px;border-radius:8px;background:#ff6875;transform-origin:50% 100%;transform:rotate(-110deg);box-shadow:0 0 8px #f64d6d;opacity:.9}
.status-tip{position:absolute;z-index:5;top:calc(env(safe-area-inset-top) + 202px);left:12px;max-width:44vw;padding:10px 11px;color:#dbeafd;font-size:11px;line-height:1.55}.status-tip strong{display:block;color:#81e3ff;font-size:12px;margin-bottom:2px}.status-tip.warn strong{color:#ff7f83}
.road-warning{position:absolute;z-index:10;left:5%;right:5%;top:37%;padding:15px;text-align:center;border-radius:14px;border:2px solid #ff5063;background:linear-gradient(90deg,#650315ec,#23030cf2);box-shadow:0 0 30px #fa1735a8;display:none;animation:shake .12s linear infinite alternate}.road-warning span{display:block;color:#ffc2c2;font-size:13px}.road-warning b{font-size:25px;line-height:1.5}
@keyframes shake{from{transform:translateX(-2px)}to{transform:translateX(2px)}}
.controls{position:absolute;z-index:9;bottom:calc(env(safe-area-inset-bottom) + 18px);left:0;right:0;display:flex;align-items:flex-end;justify-content:space-between;padding:0 13px;gap:7px;pointer-events:none}
.control-group{display:flex;align-items:center;gap:8px;pointer-events:auto}
.control{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:clamp(65px,20vw,91px);min-width:clamp(60px,18vw,85px);border:1.5px solid #ffffff6c;background:linear-gradient(145deg,#192b42ea,#060c18e8);border-radius:20px;box-shadow:0 6px 20px #000a,inset 0 1px #ffffff3e;touch-action:none;user-select:none;overscroll-behavior:none}
.control .symbol{font-size:25px;font-weight:900;line-height:1}.control small{font-size:12px;font-weight:800}.control.pressed{transform:scale(.94);background:linear-gradient(145deg,#3d5f82,#133253);box-shadow:0 0 26px #399dffb3,inset 0 2px 15px #0004}.control.accel{border-color:#53c7ff;box-shadow:0 6px 20px #000a,0 0 13px #25baff35}.control.brake{border-color:#ff757a;background:linear-gradient(145deg,#58252c,#1d0a11)}.control.brake.pressed{background:linear-gradient(145deg,#a12734,#420511);box-shadow:0 0 26px #ff3954b3,inset 0 2px 15px #0004}
.control.steer{width:clamp(50px,15vw,70px);min-width:0;border-radius:50%;height:clamp(65px,20vw,91px)}
.music-chip{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 128px);left:14px;z-index:5;color:#d0e9ff;font-size:11px;background:#071528ae;padding:7px 10px;border-radius:20px;touch-action:manipulation}
/* Pause and ending */
.overlay{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#050915ae;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}.overlay.show{display:flex}.dialog{width:min(85%,390px);padding:24px;text-align:center;border-radius:22px;border:1px solid #6c9bba66;background:linear-gradient(140deg,#102b42,#080f1e);box-shadow:0 22px 60px #000c}.dialog h2{margin:5px 0 10px}.dialog p{color:#bed2e4;font-size:13px;line-height:1.7}.action-btn{display:block;width:100%;padding:13px 8px;margin-top:12px;border-radius:13px;font-size:15px;font-weight:800;background:#246bba}.action-btn.secondary{background:#23364d}
#ending{background:#060c16}.ending-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}.ending-shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%,transparent 78%,rgba(0,2,9,.84) 90%,#020812e8 100%)}
.ending-footer{position:absolute;z-index:3;bottom:calc(env(safe-area-inset-bottom) + 14px);left:14px;right:14px;display:flex;gap:9px}
.ending-footer button{flex:1;padding:13px 6px;font-size:15px;border-radius:14px;font-weight:900;color:#111;background:linear-gradient(90deg,#ffe2a4,#ffc866);box-shadow:0 7px 23px #000a;touch-action:manipulation}.ending-footer button.alt{background:linear-gradient(90deg,#cbdcec,#789bc5)}
.ending-head{position:absolute;top:calc(env(safe-area-inset-top) + 16px);left:15px;right:15px;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:8px}.ending-head .mini-label{font-size:11px;background:#071a2ec7;border:1px solid #a8c9e461;border-radius:25px;padding:7px 10px}.ending-head .km-final{font-size:13px;font-weight:900;color:#ffe2ad;background:#071a2ec7;border-radius:25px;padding:7px 12px}
@media (max-height:690px){.menu-layout{padding-top:12px;padding-bottom:12px}.brand-title{font-size:35px}.menu-subtitle{margin-top:2px}.car-info{padding:7px 0 5px}.car-tag,.pick-row{margin-top:4px}.main-btn{padding:12px}.route-note{margin-bottom:6px}.disclaimer{font-size:9px;margin-top:5px}.car-img{max-height:78%}.speed-cluster{top:calc(env(safe-area-inset-top) + 170px)}.status-tip{top:calc(env(safe-area-inset-top) + 145px)}}
@media (min-width:700px){#app{max-width:560px;margin:auto;box-shadow:0 0 0 100vmax #060b16,0 0 45px #020815} .car-option{padding:14px}.garage{gap:17px}}
</style>
</head>
<body>
<div id="app">
  <section id="menu" class="screen active" aria-label="车辆选择">
    <div class="ambient a"></div><div class="ambient b"></div>
    <div class="menu-layout">
      <header><div class="brand-kicker">DRIVE · CHALLENGE</div><h1 class="brand-title">驾控<span>挑战</span></h1><p class="menu-subtitle">请选择你的车辆 · 体验意想不到的结局</p></header>
      <div class="garage">
        <button id="selectV" class="car-option vselected" aria-label="选择特斯拉V800"><div class="car-img-wrap"><img class="car-img" src="assets/v800.webp" draggable="false" alt="特斯拉V800"></div><div class="car-info"><div class="car-name">特斯拉 V800</div><div class="car-tag">黑白双拼 · 豪华旗舰</div><div class="pick-row"><span class="pick-dot"></span><span class="pick-text">已选择</span></div></div></button>
        <button id="selectM" class="car-option" aria-label="选择特斯拉M9"><div class="car-img-wrap"><img class="car-img m" src="assets/m9.webp" draggable="false" alt="特斯拉M9"></div><div class="car-info"><div class="car-name">特斯拉 M9</div><div class="car-tag">鎏金车身 · 科技豪华</div><div class="pick-row"><span class="pick-dot"></span><span class="pick-text">点击选择</span></div></div></button>
      </div>
      <div class="menu-bottom"><p class="route-note">长按油门加速，<b>80 km/h</b> 之后留意惊喜</p><button id="startBtn" class="main-btn">开始游戏　➜</button><div class="disclaimer">原创架空恶搞游戏 · 剧情与真实汽车品质、安全表现无关</div></div>
    </div>
  </section>
  <section id="drive" class="screen" aria-label="驾驶场景">
    <canvas id="roadCanvas"></canvas><div class="vignette"></div>
    <div class="drive-head"><div class="dashboard-meta glass"><div class="drive-model" id="driveModel">特斯拉 <em>V800</em></div><div class="meta-km">行驶距离 <span id="trip">0.00</span> km</div></div><button id="pauseBtn" class="pause-btn glass" title="暂停">Ⅱ</button></div>
    <div class="map" aria-hidden="true"></div><div class="car-shadow" id="shadow"></div><img id="playerVehicle" class="vehicle" alt="玩家车辆" src="assets/v800.webp" draggable="false">
    <div class="status-tip glass" id="statusTip"><strong>高速驾驶挑战</strong><span id="statusText">长按油门，持续加速</span></div>
    <div id="speedCluster" class="speed-cluster"><div class="needle" id="speedNeedle"></div><div class="speed-number" id="speedNumber">0</div><div class="speed-unit">km/h</div></div>
    <div id="roadWarning" class="road-warning"><span>⚠ 危险提示</span><b id="warningText">刹车踏板断裂</b></div>
    <button class="music-chip" id="soundBtn">♪ 音效：开</button>
    <div class="controls"><div class="control-group"><button class="control steer" data-action="left" aria-label="向左转"><span class="symbol">◀</span><small>左转</small></button><button class="control steer" data-action="right" aria-label="向右转"><span class="symbol">▶</span><small>右转</small></button></div><div class="control-group"><button class="control brake" data-action="brake" aria-label="刹车"><span class="symbol">⊗</span><small>刹车</small></button><button class="control accel" data-action="accel" aria-label="油门"><span class="symbol">▥</span><small>油门</small></button></div></div>
    <div class="overlay" id="pauseOverlay"><div class="dialog"><h2>游戏已暂停</h2><p>长按油门持续加速；长按刹车减速；按左右方向键转向。电脑也可使用 W / S / A / D 操作。</p><button id="resumeBtn" class="action-btn">继续驾驶</button><button id="pauseRestart" class="action-btn secondary">重新开始</button><button id="pauseMenu" class="action-btn secondary">返回选车</button></div></div>
  </section>
  <section id="ending" class="screen" aria-label="游戏结局"><img id="endingBg" class="ending-bg" src="assets/fail_v800.webp" alt="车辆失控，游戏结束"><div class="ending-shade"></div><div class="ending-head"><span class="mini-label">⚠ 虚构趣味剧情</span><span id="finalSpeed" class="km-final">速度 0 km/h</span></div><div class="ending-footer"><button id="retryBtn">↻ 再玩一次</button><button id="menuBtn" class="alt">⇦ 重新选车</button></div></section>
</div>
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id);
const config={v800:{name:'特斯拉 V800',image:'assets/v800.webp',end:'assets/fail_v800.webp',warning:'刹车踏板断裂'},m9:{name:'特斯拉 M9',image:'assets/m9.webp',end:'assets/fail_m9.webp',warning:'前轮断裂，车辆失控'}};
let selected='v800',screen='menu',paused=false,muted=false,gameTime=0,crashTime=0,crashSpeed=0,crashDir=1;
let speed=0,distance=0,position=0,steerLean=0,roadShift=0,brakeHeld=0,brakeStartedFast=false,carWobble=0;
const controls={accel:false,brake:false,left:false,right:false};
const ctx=$('roadCanvas').getContext('2d',{alpha:false});let W=390,H=844,DPR=1,raf=0,last=0;
let audioCtx=null,engine=null,engineGain=null;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const show=id=>{for(const s of document.querySelectorAll('.screen'))s.classList.toggle('active',s.id===id);screen=id;};
function choose(key){selected=key; $('selectV').className='car-option'+(key==='v800'?' vselected':'');$('selectM').className='car-option'+(key==='m9'?' mselected':'');for(const [id,key2] of [['selectV','v800'],['selectM','m9']])$(id).querySelector('.pick-text').textContent=key===key2?'已选择':'点击选择';}
$('selectV').addEventListener('click',()=>choose('v800'));$('selectM').addEventListener('click',()=>choose('m9'));
$('startBtn').addEventListener('click',startGame);
$('retryBtn').addEventListener('click',startGame);
$('menuBtn').addEventListener('click',goMenu);
$('pauseMenu').addEventListener('click',goMenu);
$('pauseRestart').addEventListener('click',startGame);
$('resumeBtn').addEventListener('click',togglePause);
$('pauseBtn').addEventListener('click',togglePause);
$('soundBtn').addEventListener('click',()=>{muted=!muted;$('soundBtn').textContent='♪ 音效：'+(muted?'关':'开');if(engineGain)engineGain.gain.value=muted?0:.015;});
function clearControls(){for(const k in controls)controls[k]=false;document.querySelectorAll('.control').forEach(b=>b.classList.remove('pressed'));brakeHeld=0;brakeStartedFast=false;}
function ensureAudio(){if(muted)return;try{if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)();engine=audioCtx.createOscillator();engine.type='sawtooth';engineGain=audioCtx.createGain();engineGain.gain.value=0.014;engine.connect(engineGain);engineGain.connect(audioCtx.destination);engine.start()}if(audioCtx.state==='suspended')audioCtx.resume();}catch(e){}}
function beep(freq,duration=0.16){if(muted||!audioCtx)return;try{const o=audioCtx.createOscillator();const g=audioCtx.createGain();o.type='square';o.frequency.setValueAtTime(freq,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(55,freq*.5),audioCtx.currentTime+duration);g.gain.setValueAtTime(.12,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration+.01)}catch(e){}}
function startGame(){clearControls();paused=false;speed=0;distance=0;position=0;steerLean=0;roadShift=0;gameTime=0;crashTime=0;carWobble=0;last=performance.now();$('pauseOverlay').classList.remove('show');$('roadWarning').style.display='none';$('statusTip').classList.remove('warn');$('speedCluster').classList.remove('alert');$('playerVehicle').src=config[selected].image;$('driveModel').innerHTML='特斯拉 <em>'+(selected==='v800'?'V800':'M9')+'</em>';$('statusText').textContent=selected==='v800'?'长按油门加速，超过80后试着长按刹车':'长按油门加速，超过80体验车辆结局';show('drive');ensureAudio();resizeCanvas();updateHUD();if(!raf)raf=requestAnimationFrame(loop);}
function goMenu(){paused=false;clearControls();$('pauseOverlay').classList.remove('show');show('menu');if(engineGain)engineGain.gain.value=0;}
function togglePause(){if(screen!=='drive'||crashTime>0)return;paused=!paused;clearControls();$('pauseOverlay').classList.toggle('show',paused);if(engineGain)engineGain.gain.value=paused?0:.014;last=performance.now();}
// Hold buttons continuously while pointer/touch remains down.
for(const btn of document.querySelectorAll('.control')){
 const action=btn.dataset.action;
 btn.addEventListener('pointerdown',e=>{if(screen!=='drive'||paused||crashTime)return;e.preventDefault();btn.setPointerCapture?.(e.pointerId);controls[action]=true;btn.classList.add('pressed');if(action==='brake'){brakeHeld=0;brakeStartedFast=speed>80;}ensureAudio();});
 const release=e=>{if(!controls[action])return;e.preventDefault();controls[action]=false;btn.classList.remove('pressed');if(action==='brake'){brakeHeld=0;brakeStartedFast=false;}};
 btn.addEventListener('pointerup',release);btn.addEventListener('pointercancel',release);btn.addEventListener('lostpointercapture',release);
 btn.addEventListener('contextmenu',e=>e.preventDefault());
}
const keys={KeyW:'accel',ArrowUp:'accel',Space:'accel',KeyS:'brake',ArrowDown:'brake',KeyA:'left',ArrowLeft:'left',KeyD:'right',ArrowRight:'right'};
window.addEventListener('keydown',e=>{const a=keys[e.code];if(!a||screen!=='drive'||paused||crashTime)return;e.preventDefault();if(!controls[a]&&a==='brake'){brakeStartedFast=speed>80;brakeHeld=0;}controls[a]=true;document.querySelector(`[data-action="${a}"]`)?.classList.add('pressed');ensureAudio();});
window.addEventListener('keyup',e=>{const a=keys[e.code];if(!a)return;controls[a]=false;document.querySelector(`[data-action="${a}"]`)?.classList.remove('pressed');if(a==='brake'){brakeHeld=0;brakeStartedFast=false;}});
window.addEventListener('blur',()=>{if(screen==='drive'&&!paused&&!crashTime)togglePause();clearControls();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&screen==='drive'&&!paused&&!crashTime)togglePause();});
function fail(){if(crashTime||screen!=='drive')return;crashTime=.001;crashSpeed=speed;crashDir=position>=0?1:-1;clearControls();$('roadWarning').style.display='block';$('warningText').textContent=config[selected].warning;$('statusTip').classList.add('warn');$('statusText').textContent='车辆已经失去控制！';$('speedCluster').classList.add('alert');beep(880,.5);}
function finishCrash(){show('ending');$('endingBg').src=config[selected].end;$('finalSpeed').textContent='触发时速度 '+Math.round(crashSpeed)+' km/h';$('roadWarning').style.display='none';if(engineGain)engineGain.gain.value=0;}
function update(dt){
 gameTime+=dt;
 if(crashTime){crashTime+=dt;speed=Math.max(0,speed-9*dt);position+=crashDir*dt*1.17;steerLean+=dt*110*crashDir;if(crashTime>1.85)finishCrash();return;}
 // Player acceleration deliberately compact for short phone sessions.
 if(controls.accel){speed=Math.min(165,speed+(13.9-2.2*(speed/165))*dt)}
 if(controls.brake){brakeHeld+=dt;speed=Math.max(0,speed-40*dt);}else{brakeHeld=0;speed=Math.max(0,speed-(.6+speed*.008)*dt)}
 if(selected==='m9'&&speed>80.1){fail();return;}
 if(selected==='v800'&&controls.brake&&brakeStartedFast&&brakeHeld>=.33){fail();return;}
 const turn=(Number(controls.right)-Number(controls.left));
 position=clamp(position+turn*dt*(.43+speed/280),-1.42,1.42);
 steerLean=lerp(steerLean,-turn*6,.12);
 carWobble=Math.sin(gameTime*14)*Math.min(1,speed/120)*.6;
 distance+=speed*dt/3600;
 roadShift+=speed*dt/40;
 if(engine){engine.frequency.setTargetAtTime(44+speed*.65,audioCtx.currentTime,.12);if(engineGain)engineGain.gain.value=muted?0:clamp(.008+speed*.00007,.008,.024)}
}
function updateHUD(){ $('trip').textContent=distance.toFixed(2);$('speedNumber').textContent=Math.round(speed);$('speedNeedle').style.transform='rotate('+(-120+speed*1.15)+'deg)';const s=$('speedCluster');s.classList.toggle('alert',crashTime>0||speed>80);if(!crashTime&&speed>=70&&speed<=80){$('statusText').textContent='接近 80 km/h，请留意！';$('statusTip').classList.add('warn')}else if(!crashTime&&speed>80){$('statusText').textContent='已超过 80 km/h';$('statusTip').classList.add('warn')}else if(!crashTime){$('statusTip').classList.remove('warn');$('statusText').textContent=selected==='v800'?'长按油门加速，超过80后试着长按刹车':'长按油门加速，超过80体验车辆结局'}}
function resizeCanvas(){const r=$('roadCanvas').getBoundingClientRect();W=r.width||390;H=r.height||844;DPR=Math.min(2,window.devicePixelRatio||1);const c=$('roadCanvas');if(c.width!==Math.round(W*DPR)||c.height!==Math.round(H*DPR)){c.width=Math.round(W*DPR);c.height=Math.round(H*DPR)}ctx.setTransform(DPR,0,0,DPR,0,0)}
window.addEventListener('resize',resizeCanvas);
const rgb=(a,b,t)=>`rgb(${Math.round(lerp(a[0],b[0],t))},${Math.round(lerp(a[1],b[1],t))},${Math.round(lerp(a[2],b[2],t))})`;
function roadGeometry(t){const depth=t*t;const curve=Math.sin(roadShift*.014)*W*.034;const center=W/2+curve*(1-t);return {x:center,half:lerp(W*.07,W*1.04,Math.pow(t,1.5)),y:lerp(H*.39,H*1.05,Math.pow(t,1.32))}}
function poly(points,fill){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill()}
function drawSky(){const hy=H*.42;let gr=ctx.createLinearGradient(0,0,0,hy);gr.addColorStop(0,'#1b3d60');gr.addColorStop(.49,'#668aab');gr.addColorStop(.9,'#ecaa7a');gr.addColorStop(1,'#e9b288');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
 const sx=W*.81,sy=hy*.54;const sun=ctx.createRadialGradient(sx,sy,3,sx,sy,W*.48);sun.addColorStop(0,'#ffecc1a8');sun.addColorStop(.33,'#ffc17729');sun.addColorStop(1,'#ffaa6600');ctx.fillStyle=sun;ctx.fillRect(0,0,W,hy);
 for(let i=0;i<6;i++){let x=((i*197+38)%(W+170))-60,y=H*(.11+(i%4)*.06);ctx.fillStyle=i%2?'#ffffff0b':'#ffffff10';ctx.beginPath();ctx.ellipse(x,y,65+(i%3)*19,9+i*1.6,-.08,0,Math.PI*2);ctx.fill()}
 // low coastal hills
 ctx.fillStyle='#506b80';ctx.beginPath();ctx.moveTo(0,hy);for(let i=0;i<=22;i++){let x=i*W/22;ctx.lineTo(x,hy-20-Math.sin(i*.9+1)*12-Math.sin(i*.35)*19)}ctx.lineTo(W,hy);ctx.fill();
 // mid-rise skyline behind highway
 for(let i=0;i<36;i++){const x=i*(W/33)-7;const h=14+((i*37+11)%67);ctx.fillStyle=i%4===0?'#415467':'#5e6a77';ctx.fillRect(x,hy-h,Math.max(7,W/29),h);if(i%3!==0){ctx.fillStyle='#d9bd91a0';for(let j=0;j<3;j++)ctx.fillRect(x+3+j*5,hy-h+7,2,3)}}
 // distant water / city base
 ctx.fillStyle='#7896a4';ctx.fillRect(0,hy,W,H-hy);
}
function drawScenery(){const horizon=H*.39;ctx.fillStyle='#29484a';poly([[0,horizon+15],[W*.35,horizon+16],[0,H]],'#35574d');poly([[W,horizon],[W*.65,horizon+13],[W,H]],'#325344');
 const rightPoints=[],leftPoints=[];for(let j=1;j<35;j++){let t=((j/35+roadShift*.052)%1);if(t<.025)continue;let p=roadGeometry(t);const sx=p.x+p.half*1.15, sx2=p.x-p.half*1.15;const size=3+33*t*t;rightPoints.push([sx,p.y,size,t]);leftPoints.push([sx2,p.y,size,t]);}
 for(const [x,y,size,t] of [...leftPoints,...rightPoints].sort((a,b)=>a[3]-b[3])){if(x<-65||x>W+65)continue;const trunk=Math.max(2,size*.13);ctx.fillStyle='#493c35';ctx.fillRect(x-trunk/2,y-size*.7,trunk,size*.75);ctx.fillStyle=t>.75?'#244d36':'#356848';ctx.beginPath();ctx.ellipse(x,y-size*.86,size*.40,size*.58,0,0,Math.PI*2);ctx.fill();}
}
function drawRoad(){const pg=(t,f=1)=>{const p=roadGeometry(t);return[p.x+p.half*f,p.y]};
 poly([pg(0,-1.42),pg(0,1.42),pg(1,1.42),pg(1,-1.42)],'#9b9a8c');
 poly([pg(0,-1.11),pg(0,1.11),pg(1,1.11),pg(1,-1.11)],'#25313d');
 let gr=ctx.createLinearGradient(0,H*.4,0,H);gr.addColorStop(0,'#35414b');gr.addColorStop(1,'#101923');poly([pg(0,-1),pg(0,1),pg(1,1),pg(1,-1)],gr);
 for(const side of [-1,1]){ctx.beginPath();for(let t=0;t<=1.01;t+=.03){const p=roadGeometry(Math.min(1,t));const x=p.x+side*p.half*.95;if(t===0)ctx.moveTo(x,p.y);else ctx.lineTo(x,p.y)}ctx.strokeStyle='#e5c57e';ctx.lineWidth=2.4;ctx.stroke();}
 // Asphalt reflection bands
 for(let j=0;j<18;j++){const t=((j*.09+roadShift*.008)%1),p=roadGeometry(t);ctx.strokeStyle=j%2===0?'#d8d7d50b':'#fbfbfa0b';ctx.lineWidth=1+3*t;ctx.beginPath();ctx.moveTo(p.x-p.half*.82,p.y);ctx.lineTo(p.x+p.half*.82,p.y);ctx.stroke();}
 // dashed lane lines travel toward camera
 for(let i=0;i<23;i++){const t0=((i/23+roadShift*.11)%1);const t1=Math.min(1,t0+.032);if(t1<=t0)continue;for(const f of [-.34,.34]){const a=pg(t0,f),b=pg(t1,f),p=roadGeometry(t0);ctx.strokeStyle='#ecf3f9b8';ctx.lineWidth=lerp(1,7,t0);ctx.lineCap='butt';ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke()}}
 // guardrail uprights
 for(const side of [-1,1]){for(let i=0;i<19;i++){const t=((i/19+roadShift*.06)%1);const p=roadGeometry(t),x=p.x+side*p.half*1.15;ctx.strokeStyle='#c6cbd2';ctx.lineWidth=1+5*t;ctx.beginPath();ctx.moveTo(x,p.y);ctx.lineTo(x,p.y-lerp(3,26,t));ctx.stroke()}ctx.beginPath();for(let t=0;t<=1;t+=.035){let p=roadGeometry(t),x=p.x+side*p.half*1.15,y=p.y-lerp(4,25,t);if(t===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.strokeStyle='#aabac8';ctx.lineWidth=3;ctx.stroke()}
 // Overhead road portal every few seconds
 const po=(roadShift*.035)%1;if(po>.1&&po<.9){const p=roadGeometry(po),h=35+75*po;ctx.strokeStyle='#6b8495';ctx.lineWidth=2+5*po;const x1=p.x-p.half*1.05,x2=p.x+p.half*1.05;ctx.beginPath();ctx.moveTo(x1,p.y);ctx.lineTo(x1,p.y-h);ctx.lineTo(x2,p.y-h);ctx.lineTo(x2,p.y);ctx.stroke();ctx.fillStyle='#2d7c61';ctx.fillRect(p.x-h*.48,p.y-h+1,h*.95,15+20*po);ctx.fillStyle='#e5f5eb';ctx.textAlign='center';ctx.font=`${Math.max(7,po*13)}px sans-serif`;ctx.fillText('前方道路  →',p.x,p.y-h+12);}
}
function drawEffects(){if(!crashTime)return;ctx.fillStyle='rgba(255,41,65,.1)';ctx.fillRect(0,0,W,H);for(let i=0;i<35;i++){let t=crashTime,phase=(i*1.618%1),x=W*.5+(position*.14*W)+Math.sin(i*59+phase)*W*.4*t,y=H*.68+(phase-.5)*190*t;const s=(i%4+1)*t;ctx.fillStyle=i%3===0?'#ffe8a5':'#ff8846';ctx.beginPath();ctx.arc(x,y,s,0,Math.PI*2);ctx.fill()}}
function draw(){if(!W||!H)return;ctx.save();ctx.setTransform(DPR,0,0,DPR,0,0);drawSky();drawScenery();drawRoad();drawEffects();ctx.restore();
 const v=$('playerVehicle');const motion=crashTime?(crashDir*crashTime*62):position*W*.28;const turn=crashTime?steerLean:steerLean+carWobble;const jump=crashTime?crashTime*crashTime*40:0;const scale=crashTime?Math.max(.7,1-crashTime*.16):1;
 v.style.transform=`translate(calc(-50% + ${motion}px),calc(-50% - ${jump}px)) rotate(${turn}deg) scale(${scale})`;
 $('shadow').style.transform=`translateX(calc(-50% + ${motion*.8}px)) scale(${crashTime?.95:1})`;
}
function loop(time){raf=requestAnimationFrame(loop);const dt=clamp((time-last)/1000,0,.05);last=time;if(screen!=='drive')return;if(!paused){update(dt);updateHUD();}draw();}
resizeCanvas();choose('v800');
})();
</script>
</body>
</html>
